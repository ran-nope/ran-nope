  <path d="M505 1 407 140M527 1 429 140" stroke="#3b315c" stroke-width="2"/>
  <text x="25" y="29" class="mono" fill="#caff6e">@RAN-NOPE</text>
  <text x="22" y="87" class="name">Kavin</text>
  <text x="26" y="117" class="sub">Web apps, machine learning, and data.</text>
