<svg xmlns="http://www.w3.org/2000/svg" width="365" height="91" viewBox="0 0 365 91" role="img" aria-labelledby="title description">
  <title id="title">Grade Lab — model evaluation</title>
  <desc id="description">A scatter plot with a softly pulsing equality line and an amber zero-grade outlier.</desc>
  <style>
    .equality { animation: equality 4.5s ease-in-out infinite; }
    .outlier { animation: halo 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes equality { 50% { opacity: 1; } }
    @keyframes halo { 50% { opacity: .5; transform: scale(1.3); } }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <rect x=".5" y=".5" width="364" height="90" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="282.5" y="9.5" width="73" height="72" rx="10" fill="#111827" stroke="#30363D"/>
  <text x="15" y="30" fill="#A5B4FC" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">MODEL EVALUATION</text>
  <text x="15" y="62" fill="#F0F6FC" font-family="Segoe UI, sans-serif" font-size="26" font-weight="750">Grade Lab</text>
  <g transform="translate(294 20)" color="#A5B4FC">
    <path d="M4 4v44h47" fill="none" stroke="#64748B" stroke-width="1.3"/>
    <path class="equality" d="M5 47 48 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3" opacity=".48"/>
    <g fill="currentColor">
      <circle cx="13" cy="36" r="2.1"/><circle cx="22" cy="32" r="2.1"/>
      <circle cx="28" cy="23" r="2.1"/><circle cx="37" cy="19" r="2.1"/>
      <circle cx="45" cy="12" r="2.1"/>
    </g>
    <circle class="outlier" cx="6" cy="24" r="5" fill="none" stroke="#FDBA74" opacity=".32"/>
    <circle cx="6" cy="24" r="2.6" fill="#FDBA74"/>
  </g>
</svg>
