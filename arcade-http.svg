<svg xmlns="http://www.w3.org/2000/svg" width="365" height="91" viewBox="0 0 365 91" role="img" aria-labelledby="title description">
  <title id="title">API Cinema — http playground</title>
  <desc id="description">Two packets travel in opposite directions on request and response arrows.</desc>
  <style>
    .packet { animation: packet 4.4s ease-in-out infinite; }
    @keyframes packet { 0%, 100% { opacity: 0; } 18%, 82% { opacity: 1; } }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <rect x=".5" y=".5" width="364" height="90" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="282.5" y="9.5" width="73" height="72" rx="10" fill="#111827" stroke="#30363D"/>
  <text x="15" y="30" fill="#C4B5FD" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">HTTP PLAYGROUND</text>
  <text x="15" y="62" fill="#F0F6FC" font-family="Segoe UI, sans-serif" font-size="26" font-weight="750">API Cinema</text>
  <g transform="translate(294 20)" color="#C4B5FD">
    <path d="M2 15h47m-6-5 6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
    <path d="M49 35H2m6-5-6 5 6 5" fill="none" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/>
    <circle class="motion packet" cx="4" cy="15" r="3" fill="currentColor">
      <animateTransform attributeName="transform" type="translate" values="0 0;42 0" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".42 0 .58 1"/>
    </circle>
    <circle class="motion packet" cx="47" cy="35" r="3" fill="#67E8F9">
      <animateTransform attributeName="transform" type="translate" values="0 0;-42 0" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".42 0 .58 1"/>
    </circle>
    <circle class="still" cx="23" cy="15" r="3" fill="currentColor"/>
    <circle class="still" cx="29" cy="35" r="3" fill="#67E8F9"/>
  </g>
</svg>
