<svg xmlns="http://www.w3.org/2000/svg" width="365" height="91" viewBox="0 0 365 91" role="img" aria-labelledby="title description">
  <title id="title">SoundSight — audio classifier</title>
  <desc id="description">Five green audio spectrum bars rise and fall in a staggered rhythm.</desc>
  <style>
    .bar { animation: spectrum 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spectrum { 0%, 100% { transform: scaleY(.82); } 34% { transform: scaleY(.54); } 67% { transform: scaleY(1); } }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <rect x=".5" y=".5" width="364" height="90" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="282.5" y="9.5" width="73" height="72" rx="10" fill="#111827" stroke="#30363D"/>
  <text x="15" y="30" fill="#6EE7B7" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">AUDIO CLASSIFIER</text>
  <text x="15" y="62" fill="#F0F6FC" font-family="Segoe UI, sans-serif" font-size="26" font-weight="750">SoundSight</text>
  <g transform="translate(294 20)" color="#6EE7B7">
    <path d="M0 25h50" stroke="#30363D" stroke-width="1"/>
    <g fill="currentColor">
      <rect class="bar" x="2" y="17" width="5" height="16" rx="2.5"/>
      <rect class="bar" x="12" y="10" width="5" height="30" rx="2.5" style="animation-delay:-.38s"/>
      <rect class="bar" x="22" y="4" width="5" height="42" rx="2.5" style="animation-delay:-.76s"/>
      <rect class="bar" x="32" y="12" width="5" height="26" rx="2.5" style="animation-delay:-1.14s"/>
      <rect class="bar" x="42" y="15" width="5" height="20" rx="2.5" style="animation-delay:-1.52s"/>
    </g>
  </g>
</svg>
