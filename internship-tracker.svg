<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 225" width="880" height="225" role="img" aria-labelledby="title desc">
  <title id="title">Internship Tracker</title>
  <desc id="desc">Organize internship applications, track statuses, and see progress over time.</desc>
  <style>
    .paper{fill:#f7e7df;stroke:#ead0c3}
    .title{font:52px Georgia,serif;fill:#192a29}
    .name{font:88px Georgia,serif;fill:#192a29}
    .copy{font:25px system-ui,sans-serif;fill:#354844}
    .label{font:700 19px system-ui,sans-serif;letter-spacing:2px;fill:#853e32}
    .detail{font:600 19px ui-monospace,monospace;fill:#853e32}
    .ink{fill:#853e32}
    .line{stroke:#853e32;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    @keyframes arrive{from{opacity:.18;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
    @keyframes sweep{from{transform:translateX(-168px)}to{transform:translateX(168px)}}
    @keyframes meter{0%,100%{transform:scaleY(.45)}45%{transform:scaleY(1)}}
    @keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
    .scan{opacity:0}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:arrive .55s ease-out 260ms both}
      .trace{stroke-dasharray:300;animation:draw .9s ease-out 380ms both}
      .scan{opacity:.7;animation:sweep 4s linear infinite}
      .meter{transform-box:fill-box;transform-origin:center;animation:meter 1.55s ease-in-out infinite}
      .signal{animation:signal 2.6s ease-in-out infinite}
    }
  </style>
  <rect class="paper" x=".5" y=".5" width="879" height="224" rx="22"/>
  <g class="enter"><text x="38" y="42" class="label">FULL-STACK WEB APP</text><text x="36" y="97" class="title">Internship Tracker</text><text x="38" y="139" class="copy">Organize internship applications,</text><text x="38" y="172" class="copy">track statuses, and see progress over time.</text><text x="38" y="204" class="detail">React · FastAPI · PostgreSQL</text><g transform="translate(709 64)"><rect x="7" y="13" width="113" height="76" rx="12" class="line"/><path class="line trace" d="M30 70V55m22 15V41m22 29V48m22 22V29"/></g><path class="line" d="M805 197h29m-10-10 10 10-10 10"/></g>
</svg>
