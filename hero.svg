<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" width="880" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Kavin</title>
  <desc id="desc">I build practical web tools and explore machine learning through demos.</desc>
  <style>
    .paper{fill:#f7f1e6;stroke:#dfd5c3}
    .title{font:52px Georgia,serif;fill:#192a29}
    .name{font:88px Georgia,serif;fill:#192a29}
    .copy{font:25px system-ui,sans-serif;fill:#354844}
    .label{font:700 19px system-ui,sans-serif;letter-spacing:2px;fill:#35675e}
    .detail{font:600 19px ui-monospace,monospace;fill:#35675e}
    .ink{fill:#35675e}
    .line{stroke:#35675e;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    @keyframes arrive{from{opacity:.18;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
    @keyframes sweep{from{transform:translateX(-168px)}to{transform:translateX(168px)}}
    @keyframes meter{0%,100%{transform:scaleY(.45)}45%{transform:scaleY(1)}}
    @keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
    .scan{opacity:0}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:arrive .55s ease-out 0ms both}
      .trace{stroke-dasharray:300;animation:draw .9s ease-out 120ms both}
      .scan{opacity:.7;animation:sweep 4s linear infinite}
      .meter{transform-box:fill-box;transform-origin:center;animation:meter 1.55s ease-in-out infinite}
      .signal{animation:signal 2.6s ease-in-out infinite}
    }
  </style>
  <rect class="paper" x=".5" y=".5" width="879" height="255" rx="22"/>
  <g class="enter"><text x="38" y="48" class="label">@RAN-NOPE</text><text x="35" y="139" class="name">Kavin</text><text x="39" y="192" class="copy">I build practical web tools and explore</text><text x="39" y="226" class="copy">machine learning through demos.</text><defs><clipPath id="scope"><circle r="90"/></clipPath><linearGradient id="beam"><stop stop-color="#f7f1e6" stop-opacity="0"/><stop offset="1" stop-color="#f7f1e6" stop-opacity=".95"/></linearGradient></defs><g transform="translate(751 128)"><circle r="90" fill="#173d38"/><g clip-path="url(#scope)"><path d="M-90-48H90M-90-24H90M-90 0H90M-90 24H90M-90 48H90M-48-90V90M-24-90V90M0-90V90M24-90V90M48-90V90" stroke="#3a645a"/><circle r="68" fill="none" stroke="#6d9887" stroke-dasharray="2 7"/><path class="trace" fill="none" stroke="#c5edaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M-72 0h20l8-10 9 20 11-34 10 48L0-45l13 80 12-49 11 24 10-10h26"/><rect class="scan" x="-37" y="-90" width="37" height="180" fill="url(#beam)"/></g><circle class="signal" cx="66" cy="-62" r="6" fill="#d0ecae"/></g></g>
</svg>
