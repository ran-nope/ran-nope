<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 225" width="880" height="225" role="img" aria-labelledby="title desc">
  <title id="title">SoundSight</title>
  <desc id="desc">Classify environmental sounds and inspect the prediction with a spectrogram.</desc>
  <style>
    .paper{fill:#0b1a21;stroke:#284b49}
    .title{font:700 48px 'Segoe UI',system-ui,sans-serif;letter-spacing:-2px;fill:#eff8ff}
    .name{font:800 106px 'Segoe UI',system-ui,sans-serif;letter-spacing:-7px;fill:#eff8ff}
    .copy{font:25px system-ui,sans-serif;fill:#c1cedc}
    .label{font:700 19px system-ui,sans-serif;letter-spacing:2px;fill:#8df9cc}
    .detail{font:600 19px ui-monospace,monospace;fill:#8df9cc}
    .ink{fill:#8df9cc}
    .line{stroke:#8df9cc;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    @keyframes arrive{from{opacity:.18;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
    @keyframes sweep{from{transform:translateX(-168px)}to{transform:translateX(168px)}}
    @keyframes meter{0%,100%{transform:scaleY(.45)}45%{transform:scaleY(1)}}
    @keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes packet{0%,12%{opacity:0;transform:translateX(0)}22%{opacity:1}70%{opacity:1}88%,100%{opacity:0;transform:translateX(95px)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes point{0%,100%{transform:translateY(12px);opacity:.42}50%{transform:translateY(0);opacity:1}}
    .scan{opacity:0}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:arrive .55s ease-out 80ms both}
      .trace{stroke-dasharray:300;animation:draw .9s ease-out 200ms both}
      .scan{opacity:.7;animation:sweep 4s linear infinite}
      .meter{transform-box:fill-box;transform-origin:center;animation:meter 1.55s ease-in-out infinite}
      .signal{animation:signal 2.6s ease-in-out infinite}
      .packet{animation:packet 3s linear infinite}
      .orbit{animation:orbit 14s linear infinite}
      .point{animation:point 3.2s ease-in-out infinite}
    }
  </style>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#94a3b8" stroke-opacity=".13" fill="none"/></pattern></defs>
  <rect class="paper" x=".5" y=".5" width="879" height="224" rx="18"/>
  <rect x="680" y="16" width="182" height="193" rx="12" fill="#050b15" stroke="#25364a"/>
  <rect x="680" y="16" width="182" height="193" rx="12" fill="url(#grid)"/>
  <g class="enter"><text x="38" y="42" class="label">AUDIO MACHINE LEARNING</text><text x="36" y="97" class="title">SoundSight</text><text x="38" y="139" class="copy">Classify environmental sounds and</text><text x="38" y="172" class="copy">inspect the prediction with a spectrogram.</text><text x="38" y="204" class="detail">Python · ESC-50 · Streamlit</text><g transform="translate(709 64)"><rect class="ink meter" x="4" y="39" width="8" height="22" rx="4" style="animation-delay:0ms"/><rect class="ink meter" x="20" y="31" width="8" height="38" rx="4" style="animation-delay:-130ms"/><rect class="ink meter" x="36" y="17.5" width="8" height="65" rx="4" style="animation-delay:-260ms"/><rect class="ink meter" x="52" y="6" width="8" height="88" rx="4" style="animation-delay:-390ms"/><rect class="ink meter" x="68" y="25.5" width="8" height="49" rx="4" style="animation-delay:-520ms"/><rect class="ink meter" x="84" y="14.5" width="8" height="71" rx="4" style="animation-delay:-650ms"/><rect class="ink meter" x="100" y="32.5" width="8" height="35" rx="4" style="animation-delay:-780ms"/><rect class="ink meter" x="116" y="38.5" width="8" height="23" rx="4" style="animation-delay:-910ms"/></g><path class="line" d="M805 192h29m-10-10 10 10-10 10"/></g>
</svg>
