<svg xmlns="http://www.w3.org/2000/svg" width="365" height="91" viewBox="0 0 365 91" role="img" aria-labelledby="title description">
  <title id="title">Internship Tracker — full-stack app</title>
  <desc id="description">A glowing data point moves along a chart to represent application progress.</desc>
  <style>
    .trail { animation: trail 4.5s ease-in-out infinite; }
    @keyframes trail { 0%, 100% { opacity: 0; } 16%, 82% { opacity: 1; } }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <rect x=".5" y=".5" width="364" height="90" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="282.5" y="9.5" width="73" height="72" rx="10" fill="#111827" stroke="#30363D"/>
  <text x="15" y="30" fill="#F9A8D4" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">FULL-STACK APP</text>
  <text x="15" y="62" fill="#F0F6FC" font-family="Segoe UI, sans-serif" font-size="26" font-weight="750">Internship Tracker</text>
  <g transform="translate(294 20)" color="#F9A8D4">
    <path d="M4 7v38h47" fill="none" stroke="#64748B" stroke-width="1.3"/>
    <path d="M8 37 19 27 29 31 47 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="motion trail" fill="currentColor">
      <circle r="5" opacity=".26"/><circle r="2.6"/>
      <animateMotion path="M8 37 19 27 29 31 47 12" dur="4.5s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".42 0 .58 1"/>
    </g>
    <circle class="still" cx="47" cy="12" r="2.6" fill="currentColor"/>
  </g>
</svg>
